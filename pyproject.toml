[project]
name = "regwatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.1",
    "lxml>=5.0",
    "httpx>=0.27",
    "djangorestframework>=3.15",
    "gunicorn>=22.0",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pip-audit>=2.7",
    # Direct only to floor the version pip-audit drags in through pip-api:
    # PYSEC-2026-3721 affects pip < 26.2 and failed the CI audit gate on
    # 2026-08-26. Dev-group only -- the image builds with `uv sync --no-dev`,
    # so pip is never in the runtime environment.
    "pip>=26.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-q"
